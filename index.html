<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Extremo Experience — Convite</title>

  <meta
    name="description"
    content="Você é nosso convidado para o lançamento Extremo Experience."
  >

  <!-- Configurações da capa ao compartilhar o link -->

  <meta property="og:type" content="website">

  <meta
    property="og:title"
    content="Extremo Experience — Convite"
  >

  <meta
    property="og:description"
    content="Você é nosso convidado para uma noite inesquecível."
  >

  <meta
    property="og:image"
    content="https://viniciusrochasilva.github.io/convite-extremo/extremo.jpg"
  >

  <meta
    property="og:url"
    content="https://viniciusrochasilva.github.io/convite-extremo/"
  >

  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1536">
  <meta property="og:image:type" content="image/jpeg">

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Extremo Experience — Convite"
  >

  <meta
    name="twitter:description"
    content="Você é nosso convidado para uma noite inesquecível."
  >

  <meta
    name="twitter:image"
    content="https://viniciusrochasilva.github.io/convite-extremo/extremo.jpg"
  >

  <link rel="icon" href="extremo.jpg">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="pagina">

    <section
      class="convite"
      aria-label="Convite Extremo Experience"
    >

      <img
        class="imagem-convite"
        src="extremo.jpg"
        alt="Convite para o lançamento Extremo Experience"
      >

      <!--
        Área invisível clicável sobre a parte:
        CONFIRMAR PRESENÇA — CLIQUE AQUI
      -->

      <a
        class="link-confirmacao"
        href="https://docs.google.com/forms/d/e/1FAIpQLSck9qVnXlS4YVXh5ZAR1tUW5neYo5AHQ0x7zvOE_1dP7CY9EA/viewform?usp=publish-editor"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar presença no evento"
        title="Confirmar presença"
      ></a>

    </section>

  </main>

  <!-- Áudio de fundo -->

  <audio
    id="audioFundo"
    loop
    preload="auto"
  >
    <source
      src="audio.m4a"
      type="audio/mp4"
    >

    Seu navegador não suporta reprodução de áudio.
  </audio>

  <!-- Botão para ativar ou pausar a música -->

  <button
    id="botaoAudio"
    class="botao-audio"
    type="button"
    aria-label="Ativar música"
    aria-pressed="false"
    title="Ativar ou pausar música"
  >
    <span id="iconeAudio" aria-hidden="true">🔇</span>
    <span id="textoAudio">Ativar música</span>
  </button>

  <script src="script.js"></script>

</body>
</html>
